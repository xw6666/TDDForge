<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDDForge Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #333; }
  header { background: #1a1a2e; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; }
  #system-status { font-size: 13px; opacity: 0.8; }
  .container { display: flex; height: calc(100vh - 48px); }
  .task-list-panel { width: 360px; min-width: 360px; border-right: 1px solid #ddd; background: #fff; overflow-y: auto; }
  .detail-panel { flex: 1; overflow-y: auto; padding: 16px; }
  .task-list-header { padding: 12px 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
  .task-list-header h2 { font-size: 15px; }
  .task-item { padding: 10px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  .task-item:hover { background: #f8f8ff; }
  .task-item.active { background: #e8e8ff; }
  .task-item .task-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .task-item .task-meta { font-size: 12px; color: #666; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 500; }
  .badge-PENDING { background: #e0e0e0; }
  .badge-PLANNING, .badge-TEST_WRITING, .badge-TEST_REVIEWING, .badge-CODING, .badge-REVIEWING { background: #bbdefb; }
  .badge-COMPLETED { background: #c8e6c9; }
  .badge-FAILED, .badge-CANCELLED { background: #ffcdd2; }
  .badge-NEEDS_ARBITRATION { background: #fff9c4; }
  .badge-TEST_WRITE_FAILED, .badge-TEST_REVIEW_FAILED, .badge-REVIEW_FAILED { background: #ffe0b2; }
  .badge-HIGH, .badge-CRITICAL { color: #c62828; }
  .badge-LOW { color: #2e7d32; }
  .detail-section { margin-bottom: 16px; }
  .detail-section h3 { font-size: 14px; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
  .detail-table { width: 100%; font-size: 13px; }
  .detail-table td { padding: 3px 8px; vertical-align: top; }
  .detail-table td:first-child { font-weight: 500; width: 160px; color: #555; }
  .detail-table td:last-child { word-break: break-all; }
  .actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .actions button { padding: 6px 14px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
  .actions button:hover:not(:disabled) { background: #f0f0f0; }
  .actions button:disabled { opacity: 0.4; cursor: not-allowed; }
  .actions button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  .actions button.primary:hover:not(:disabled) { background: #1557b0; }
  .actions button.danger { color: #c62828; border-color: #c62828; }
  .actions button.danger:hover:not(:disabled) { background: #ffebee; }
  pre.output { background: #f5f5f5; padding: 8px; border-radius: 4px; font-size: 12px; overflow-x: auto; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .run-card { border: 1px solid #e0e0e0; border-radius: 4px; margin-bottom: 8px; padding: 10px; background: #fafafa; }
  .run-card .run-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .run-card .run-header .run-type { font-weight: 600; font-size: 13px; }
  .run-card .run-meta { font-size: 12px; color: #555; margin-bottom: 6px; }
  .run-card pre { font-size: 11px; max-height: 200px; }
  .no-selection { color: #999; text-align: center; padding: 40px; }
  .revise-form { margin-top: 8px; }
  .revise-form textarea { width: 100%; height: 60px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; resize: vertical; }
  .revise-form button { margin-top: 4px; }
  .phase-output { margin-bottom: 8px; }
  .phase-output summary { cursor: pointer; font-weight: 500; font-size: 13px; padding: 4px 0; }
  .refresh-indicator { font-size: 11px; color: #999; }
</style>
</head>
<body>
<header>
  <h1>TDDForge Dashboard</h1>
  <span id="system-status"></span>
</header>
<div class="container">
  <div class="task-list-panel">
    <div class="task-list-header">
      <h2>Tasks</h2>
      <span class="refresh-indicator" id="refresh-indicator"></span>
    </div>
    <div id="task-list"></div>
  </div>
  <div class="detail-panel" id="detail-panel">
    <div class="no-selection">Select a task from the list</div>
  </div>
</div>
<script>
const API = '/api';
let selectedTaskId = null;
let pollTimer = null;

async function fetchJson(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || res.statusText);
  }
  return res.json();
}

function formatDuration(ms) {
  if (ms == null) return '-';
  if (ms < 1000) return ms + 'ms';
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + 's';
  return (s / 60).toFixed(1) + 'm';
}

function formatTime(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleString();
}

function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function loadSystemStatus() {
  try {
    const s = await fetchJson(API + '/system/status');
    document.getElementById('system-status').textContent =
      (s.started ? 'Running' : 'Stopped') + ' | ' +
      s.runningTasks + ' running / ' + s.pendingTasks + ' pending / max ' + s.maxParallelTasks;
  } catch (e) {
    document.getElementById('system-status').textContent = 'Status unavailable';
  }
}

async function loadTaskList() {
  try {
    const tasks = await fetchJson(API + '/tasks');
    const container = document.getElementById('task-list');
    container.innerHTML = '';
    tasks.forEach(t => {
      const div = document.createElement('div');
      div.className = 'task-item' + (t.id === selectedTaskId ? ' active' : '');
      div.onclick = () => selectTask(t.id);
      const parentInfo = t.parentId ? ' <span style="font-size:11px;color:#888">child of ' + esc(t.parentId.substring(0,8)) + '</span>' : '';
      const errorInfo = t.error ? ' <span style="color:#c62828;font-size:11px" title="' + esc(t.error) + '">ERR</span>' : '';
      div.innerHTML =
        '<div class="task-title">' + esc(t.title) + '</div>' +
        '<div class="task-meta">' +
          '<span class="badge badge-' + t.status + '">' + t.status + '</span>' +
          '<span class="badge badge-' + t.priority + '">' + t.priority + '</span>' +
          parentInfo + errorInfo +
          (t.branchName ? ' <span>' + esc(t.branchName) + '</span>' : '') +
        '</div>';
      container.appendChild(div);
    });
    document.getElementById('refresh-indicator').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    console.error('Failed to load tasks', e);
  }
}

async function selectTask(id) {
  selectedTaskId = id;
  await loadTaskList();
  await loadTaskDetail(id);
}

async function loadTaskDetail(id) {
  const panel = document.getElementById('detail-panel');
  try {
    const [detail, runs] = await Promise.all([
      fetchJson(API + '/tasks/' + id),
      fetchJson(API + '/tasks/' + id + '/runs')
    ]);
    renderTaskDetail(detail, runs);
  } catch (e) {
    panel.innerHTML = '<div class="no-selection">Error loading task: ' + esc(e.message) + '</div>';
  }
}

function renderTaskDetail(t, runs) {
  const panel = document.getElementById('detail-panel');
  const canDispatch = t.status === 'PENDING';
  const canCancel = t.status !== 'COMPLETED' && t.status !== 'CANCELLED';
  const canRevise = t.status === 'NEEDS_ARBITRATION';
  const canClean = ['COMPLETED', 'FAILED', 'CANCELLED', 'NEEDS_ARBITRATION'].includes(t.status);
  const canPublish = t.status === 'COMPLETED';

  let childrenHtml = '';
  if (t.children && t.children.length > 0) {
    childrenHtml = '<div class="detail-section"><h3>Children</h3><table class="detail-table">';
    t.children.forEach(c => {
      childrenHtml += '<tr><td><a href="#" onclick="selectTask(\'' + c.id + '\');return false">' + esc(c.id.substring(0,12)) + '</a></td><td>' +
        esc(c.title) + ' <span class="badge badge-' + c.status + '">' + c.status + '</span></td></tr>';
    });
    childrenHtml += '</table></div>';
  }

  let phaseOutputsHtml = '';
  const phases = [
    {label: 'Plan Output', val: t.planOutput},
    {label: 'Test Output', val: t.testOutput},
    {label: 'Test Review Output', val: t.testReviewOutput},
    {label: 'Code Output', val: t.codeOutput},
    {label: 'Review Output', val: t.reviewOutput}
  ];
  phases.forEach(p => {
    if (p.val) {
      phaseOutputsHtml += '<div class="phase-output"><details><summary>' + p.label + '</summary><pre class="output">' + esc(p.val) + '</pre></details></div>';
    }
  });
  if (phaseOutputsHtml) {
    phaseOutputsHtml = '<div class="detail-section"><h3>Phase Outputs</h3>' + phaseOutputsHtml + '</div>';
  }

  let runsHtml = '';
  if (runs && runs.length > 0) {
    runsHtml = '<div class="detail-section"><h3>Agent Runs</h3>';
    runs.forEach(r => {
      runsHtml += '<div class="run-card">' +
        '<div class="run-header"><span class="run-type">' + esc(r.agentType) + '</span>' +
        '<span style="font-size:12px;color:#666">' + formatTime(r.createdAt) + '</span></div>' +
        '<div class="run-meta">Model: ' + esc(r.model) +
        ' | Exit: ' + r.exitCode +
        ' | Duration: ' + formatDuration(r.durationMs) +
        (r.sessionId ? ' | Session: ' + esc(r.sessionId) : '') +
        (r.continueCount > 0 ? ' | Continues: ' + r.continueCount : '') +
        '</div>';
      if (r.prompt) {
        runsHtml += '<details><summary style="cursor:pointer;font-size:12px">Prompt</summary><pre class="output">' + esc(r.prompt) + '</pre></details>';
      }
      if (r.output) {
        runsHtml += '<details><summary style="cursor:pointer;font-size:12px">Raw Output</summary><pre class="output">' + esc(r.output) + '</pre></details>';
      }
      runsHtml += '</div>';
    });
    runsHtml += '</div>';
  }

  let reviseFormHtml = '';
  if (canRevise) {
    reviseFormHtml = '<div class="revise-form">' +
      '<textarea id="revise-feedback" placeholder="Enter revision feedback..."></textarea>' +
      '<button class="primary" onclick="doRevise()">Submit Revision</button></div>';
  }

  panel.innerHTML =
    '<div class="detail-section"><h3>' + esc(t.title) + '</h3></div>' +
    '<div class="actions">' +
      '<button class="primary" onclick="doDispatch()"' + (canDispatch ? '' : ' disabled') + '>Dispatch</button>' +
      '<button class="danger" onclick="doCancel()"' + (canCancel ? '' : ' disabled') + '>Cancel</button>' +
      '<button onclick="doRevisePrompt()"' + (canRevise ? '' : ' disabled') + '>Revise</button>' +
      '<button onclick="doClean()"' + (canClean ? '' : ' disabled') + '>Clean</button>' +
      '<button class="primary" onclick="doPublish()"' + (canPublish ? '' : ' disabled') + '>Publish</button>' +
    '</div>' +
    reviseFormHtml +
    '<div class="detail-section"><h3>Details</h3><table class="detail-table">' +
      tr('ID', t.id) +
      tr('Status', '<span class="badge badge-' + t.status + '">' + t.status + '</span>') +
      tr('Priority', t.priority) +
      tr('Source', t.source) +
      tr('Mode', t.taskMode) +
      tr('Parent ID', t.parentId || '-') +
      tr('Branch', t.branchName || '-') +
      tr('Worktree', t.worktreePath || '-') +
      tr('Complexity', t.complexity || '-') +
      tr('Retry Count', t.retryCount + ' / general') +
      tr('Test Retries', t.testRetryCount + ' / ' + t.maxTestRetries) +
      tr('Code Retries', t.codeRetryCount + ' / ' + t.maxCodeRetries) +
      tr('Force No Split', t.forceNoSplit) +
      tr('Review Pass', t.reviewPass) +
      tr('Session IDs', (t.sessionIds || []).join(', ') || '-') +
      tr('Error', t.error || '-') +
      tr('User Feedback', t.userFeedback || '-') +
      tr('Description', '<pre class="output" style="max-height:200px">' + esc(t.description) + '</pre>') +
      tr('Created', formatTime(t.createdAt)) +
      tr('Updated', formatTime(t.updatedAt)) +
      tr('Started', formatTime(t.startedAt)) +
      tr('Completed', formatTime(t.completedAt)) +
      tr('Published', formatTime(t.publishedAt)) +
    '</table></div>' +
    childrenHtml +
    phaseOutputsHtml +
    runsHtml;
}

function tr(label, value) {
  return '<tr><td>' + label + '</td><td>' + value + '</td></tr>';
}

async function doAction(action, method, body) {
  if (!selectedTaskId) return;
  try {
    const opts = { method: method || 'POST', headers: {} };
    if (body) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    const result = await fetchJson(API + '/tasks/' + selectedTaskId + '/' + action, opts);
    alert(result.message || 'Success');
    await loadTaskList();
    await loadTaskDetail(selectedTaskId);
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

function doDispatch() { doAction('dispatch'); }
function doCancel() { if (confirm('Cancel this task?')) doAction('cancel'); }
function doClean() { if (confirm('Clean worktree and branch?')) doAction('clean'); }
function doPublish() { if (confirm('Publish branch?')) doAction('publish'); }

function doRevisePrompt() {
  const ta = document.getElementById('revise-feedback');
  if (ta) ta.focus();
}

async function doRevise() {
  const feedback = document.getElementById('revise-feedback').value.trim();
  if (!feedback) { alert('Feedback is required'); return; }
  await doAction('revise', 'POST', { feedback });
}

function startPolling() {
  loadSystemStatus();
  loadTaskList();
  pollTimer = setInterval(() => {
    loadSystemStatus();
    loadTaskList();
    if (selectedTaskId) loadTaskDetail(selectedTaskId);
  }, 5000);
}

startPolling();
</script>
</body>
</html>
