<script>
  (function initTheme() {
    try {
      const saved = localStorage.getItem('tddforge-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.add('theme-' + theme);
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
      document.documentElement.classList.add('theme-light');
    }
  })();
</script>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--paper); }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 13px;
    line-height: 1.45;
    background:
      linear-gradient(rgba(110, 83, 58, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110, 83, 58, 0.018) 1px, transparent 1px),
      var(--paper);
    background-size: 22px 22px, 22px 22px, auto;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: var(--grain-opacity);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,0.45) 0 0.5px, transparent 0.7px),
      radial-gradient(circle at 74% 36%, rgba(204,120,92,0.28) 0 0.5px, transparent 0.7px),
      radial-gradient(circle at 42% 82%, rgba(255,255,255,0.22) 0 0.5px, transparent 0.7px);
    background-size: 17px 19px, 23px 29px, 31px 37px;
    mix-blend-mode: soft-light;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  }

  button, input, textarea, select { font: inherit; }

  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;

  header {
    height: 64px;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line);
    background: var(--header-bg);
    backdrop-filter: blur(14px);
    color: var(--ink);
    position: sticky;
    top: 0;
    z-index: 20;

  header h1 {

    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0;

  .header-actions { display: flex; align-items: center; gap: 14px; min-width: 0; }
  #system-status {
    font-size: 11px;

    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  #system-status span span:first-child, #system-status .stat-label { color: var(--muted); }
  #system-status .stat-value { color: var(--ink); font-weight: 700; }

  .container {
    display: flex;
    height: calc(100vh - 64px);
    padding: 18px;
    gap: 18px;
    position: relative;
    z-index: 1;
  }

  .task-list-panel {
    width: 390px;
    min-width: 330px;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel-bg);
    box-shadow: var(--shadow-soft);
    animation: fadeIn 0.28s ease both;
  }
  .task-list-header {
    padding: 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-header-bg);
  }
  .task-list-header .top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .task-list-header .top-row > div { display: flex; gap: 8px; align-items: center; }
  .task-list-header h2 {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0;
  }
  .refresh-indicator { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .btn-new-task, .btn-system, .sys-btn, .modal-footer .btn-submit, .sys-modal-footer .btn-save, .actions button.primary, .revise-form .btn-row button.primary {
    min-height: 32px;
    padding: 7px 13px;
    border: 1px solid var(--accent-dark);
    border-radius: 7px;
    background: var(--accent);
    color: var(--primary-text);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    box-shadow: var(--shadow-tiny);
  }
  .btn-new-task:hover, .btn-system:hover, .sys-btn:hover, .modal-footer .btn-submit:hover, .sys-modal-footer .btn-save:hover, .actions button.primary:hover:not(:disabled), .revise-form .btn-row button.primary:hover:not(:disabled) {

    box-shadow: var(--accent-glow), var(--shadow-tiny);

  .btn-theme {

  .search-row input:focus, .form-group input:focus, .form-group textarea:focus, .revise-form textarea:focus, .form-group select:focus, .sys-card .sys-row select:focus, .sys-card .sys-row input:focus {

  .filter-btn:hover { border-color: var(--line-strong); background: var(--button-hover-bg); box-shadow: var(--accent-glow); }

<body>

<header>
  <h1>TDDForge Console</h1>
  <div class="header-actions">
    <button class="btn-theme" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle color theme">◐</button>
    <button class="btn-system" onclick="openSystemModal()">System</button>
    <div id="system-status"></div>
  </div>
</header>

<div class="container">
  <div class="task-list-panel">
    <div class="task-list-header">
      <div class="top-row">
        <h2>Tasks</h2>
        <div>
          <span class="refresh-indicator" id="refresh-indicator"></span>
          <button class="btn-new-task" onclick="openNewTaskModal()">+ New Task</button>
        </div>
      </div>
      <div class="search-row">
        <input type="text" id="task-search" placeholder="Search title / id / branch..." oninput="applyFilters()">
      </div>
      <div class="filter-row" id="filter-row"></div>
    </div>
    <div class="task-list-body" id="task-list"></div>
  </div>

  <div class="detail-panel" id="detail-panel">
    <div class="no-selection">Select a task from the list</div>
  </div>
</div>

<!-- New Task Modal -->
<div class="modal-overlay" id="new-task-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>New Task</h3>
      <button class="modal-close" onclick="closeNewTaskModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="nt-title">Title *</label>
        <input type="text" id="nt-title" maxlength="512" placeholder="Task title">
        <div class="form-error" id="nt-title-err"></div>
      </div>
      <div class="form-group">
        <label for="nt-desc">Description *</label>
        <textarea id="nt-desc" placeholder="Describe what needs to be done..."></textarea>
        <div class="form-error" id="nt-desc-err"></div>
      </div>
      <div class="form-group">
        <label for="nt-priority">Priority</label>
        <select id="nt-priority">
          <option value="LOW">LOW</option>
          <option value="MEDIUM" selected>MEDIUM</option>
          <option value="HIGH">HIGH</option>
          <option value="CRITICAL">CRITICAL</option>
        </select>
      </div>
      <div class="form-group">
        <div class="checkbox-row">
          <input type="checkbox" id="nt-forceNoSplit">
          <label for="nt-forceNoSplit">Force No Split (do not decompose into subtasks)</label>
        </div>
      </div>
      <div class="form-error" id="nt-submit-err"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeNewTaskModal()">Cancel</button>
      <button class="btn-submit" id="nt-submit-btn" onclick="submitNewTask()">Create Task</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- System Config Modal -->
<div class="sys-modal-overlay" id="sys-modal">
  <div class="sys-modal">
    <div class="sys-modal-header">
      <h3>Model Configuration</h3>
      <button class="modal-close" onclick="closeSystemModal()">&times;</button>
    </div>
    <div class="sys-modal-body" id="sys-modal-body">
      <div class="sys-loading">Loading...</div>
    </div>
    <div class="sys-modal-footer">
      <button class="btn-cancel" onclick="closeSystemModal()">Cancel</button>
      <button class="btn-save" id="sys-save-btn" onclick="saveModelConfig()">Save Model Changes</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
let selectedTaskId = null;
let allTasks = [];
let currentFilter = 'All';
let searchQuery = '';
let pollTimer = null;
let formDirty = false;
let isActionPending = false;
let lastTaskDetail = null;
let lastTaskRuns = null;
let renderedTaskId = null;
const detailsOpenState = new Map();
const detailsScrollState = new Map();
const panelScrollState = new Map();
const expandedTaskGroups = new Set();

const STATUSES = ['All','PENDING','PLANNING','TEST_WRITING','TEST_REVIEWING','CODING','REVIEWING','NEEDS_ARBITRATION','COMPLETED','FAILED','CANCELLED'];

// --- Utilities ---

function currentTheme() {
  return document.documentElement.dataset.theme || 'light';
}

function applyTheme(theme, persist) {
  const nextTheme = theme === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = nextTheme;
  document.documentElement.classList.toggle('theme-dark', nextTheme === 'dark');
  document.documentElement.classList.toggle('theme-light', nextTheme === 'light');
  if (persist) {
    localStorage.setItem('tddforge-theme', nextTheme);
  }
  const btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.textContent = nextTheme === 'dark' ? '☼' : '◐';
    btn.title = nextTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    btn.setAttribute('aria-label', btn.title);
  }
}

function toggleTheme() {
  applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
}

function initThemeToggle() {
  applyTheme(currentTheme(), false);
  if (window.matchMedia) {
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    const onThemeChange = event => {
      if (!localStorage.getItem('tddforge-theme')) {
        applyTheme(event.matches ? 'dark' : 'light', false);
      }
    };
    if (media.addEventListener) {
      media.addEventListener('change', onThemeChange);
    } else if (media.addListener) {
      media.addListener(onThemeChange);
    }
  }
}

async function fetchJson(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) {
    let msg;
    try {
      const body = await res.json();
      msg = body.message || body.error || res.statusText;
    } catch { msg = res.statusText; }
    throw new Error(msg);
  }
  return res.json();
}

function esc(str) {
  if (str == null) return '';
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

function formatDuration(ms) {
  if (ms == null) return '-';
  if (ms < 1000) return ms + 'ms';
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + 's';
  return (s / 60).toFixed(1) + 'm';
}

function formatTime(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleString();
}

function formatTimeShort(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const diffMs = now - d;
  if (diffMs < 60000) return 'just now';
  if (diffMs < 3600000) return Math.floor(diffMs/60000) + 'm ago';
  if (diffMs < 86400000) return Math.floor(diffMs/3600000) + 'h ago';
  return d.toLocaleDateString();
}

function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.className = 'toast'; }, 4000);
}

async function copyText(text) {
  const value = text == null ? '' : String(text);
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(value);
    } else {
      fallbackCopyText(value);
    }
    showToast('Copied to clipboard', 'success');
  } catch (e) {
    try {
      fallbackCopyText(value);
      showToast('Copied to clipboard', 'success');
    } catch (fallbackError) {
      console.error('Copy failed', fallbackError);
      showToast('Copy failed', 'error');
    }
  }
}

function fallbackCopyText(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  const ok = document.execCommand('copy');
  document.body.removeChild(ta);
  if (!ok) {
    throw new Error('execCommand copy returned false');
  }
}

function encodeCopyText(text) {
  const bytes = new TextEncoder().encode(text || '');
  let binary = '';
  bytes.forEach(b => { binary += String.fromCharCode(b); });
  return btoa(binary);
}

function decodeCopyText(encoded) {
  const binary = atob(encoded);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return new TextDecoder().decode(bytes);
}

function copyEncodedText(encoded) {
  copyText(decodeCopyText(encoded));
}

function copyButton(text, label, className) {
  return '<button type="button" class="' + esc(className || 'output-copy-btn') + '" onclick="event.preventDefault();event.stopPropagation();copyEncodedText(\'' + encodeCopyText(text) + '\');return false;">' + esc(label || 'Copy') + '</button>';
}

function parseNdjson(text) {
  if (!text || !text.trim()) return [];
  const lines = text.split(/\r?\n/).filter(line => line.trim());
  if (lines.length === 0) return [];
  const events = [];
  let parsed = 0;
  lines.forEach((line, idx) => {
    try {
      const event = JSON.parse(line);
      if (event && typeof event === 'object') {
        events.push({ raw: line, event });
        parsed++;
      } else {
        events.push({ raw: line, event: { type: 'raw', text: line, line: idx + 1 } });
      }
    } catch {
      events.push({ raw: line, event: { type: 'raw', text: line, line: idx + 1 } });
    }
  });
  return parsed > 0 ? events : [];
}

function shortId(value) {
  if (!value) return '';
  const text = String(value);
  return text.length > 14 ? text.substring(0, 14) + '...' : text;
}

function eventType(event) {
  if (!event) return 'raw';
  const part = event.part || {};
  return event.type || part.type || 'raw';
}

function eventText(event) {
  const part = event.part || {};
  if (event.text != null) return event.text;
  if (part.text != null) return part.text;
  if (part.state && part.state.output != null) return part.state.output;
  if (event.message != null) return event.message;
  return '';
}

function eventMeta(event) {
  const part = event.part || {};
  const bits = [];
  const session = event.sessionId || event.sessionID || part.sessionId || part.sessionID;
  if (session) bits.push('session ' + shortId(session));
  if (event.timestamp) bits.push(new Date(event.timestamp).toLocaleTimeString());
  if (part.tool) bits.push('tool ' + part.tool);
  if (part.callID) bits.push('call ' + shortId(part.callID));
  if (part.reason) bits.push('reason ' + part.reason);
  return bits.join(' | ');
}

function eventSummary(event) {
  const type = eventType(event);
  const part = event.part || {};
  if (type === 'tool_use' || type === 'tool') {
    const state = part.state || {};
    const input = state.input || {};
    const title = part.title || state.title || state.input?.description || '';
    const status = state.status || '';
    return '<span class="event-kv"><b>tool</b> ' + esc(part.tool || event.tool_name || 'unknown') + '</span>' +
      (status ? '<span class="event-kv"><b>status</b> ' + esc(status) + '</span>' : '') +
      (title ? '<span class="event-kv"><b>title</b> ' + esc(title) + '</span>' : '') +
      (input.command ? '<span class="event-kv"><b>cmd</b> ' + esc(input.command) + '</span>' : '');
  }
  if (type === 'step_finish' || type === 'step-finish') {
    const tokens = part.tokens || {};
    return (part.reason ? '<span class="event-kv"><b>reason</b> ' + esc(part.reason) + '</span>' : '') +
      (tokens.total != null ? '<span class="event-kv"><b>tokens</b> ' + esc(tokens.total) + '</span>' : '') +
      (event.cost != null || part.cost != null ? '<span class="event-kv"><b>cost</b> ' + esc(event.cost ?? part.cost) + '</span>' : '');
  }
  if (type === 'step_start' || type === 'step-start') {
    return '<span class="event-kv"><b>step</b> started</span>';
  }
  return '';
}

function renderEventOutput(text) {
  const items = parseNdjson(text);
  if (items.length === 0) {
    return '<div class="output-shell">' + copyButton(text, 'Copy output') + '<pre class="output">' + esc(text) + '</pre></div>';
  }
  let lastMeaningfulIndex = -1;
  let lastTextIndex = -1;
  items.forEach((item, idx) => {
    const type = eventType(item.event);
    if ((type === 'text' || type === 'message') && eventText(item.event)) {
      lastTextIndex = idx;
    }
    if (eventText(item.event) || eventSummary(item.event)) {
      lastMeaningfulIndex = idx;
    }
  });
  const defaultOpenIndex = lastTextIndex >= 0 ? lastTextIndex : lastMeaningfulIndex;
  let html = '<div class="output event-output">';
  items.forEach((item, idx) => {
    const event = item.event;
    const type = eventType(event);
    const normalized = String(type).replace(/_/g, '-');
    const meta = eventMeta(event);
    const bodyText = eventText(event);
    const summary = eventSummary(event);
    const copyPayload = bodyText || item.raw;
    const shouldOpen = idx === defaultOpenIndex;
    html += '<details class="event-card event-' + esc(String(type)) + ' event-' + esc(normalized) + '"' + (shouldOpen ? ' open' : '') + '>' +
      '<summary><div class="event-head"><span class="event-title"><span class="event-type">' + esc(type) + '</span></span>' +
      '<span class="event-actions"><span class="event-meta" title="' + esc(meta) + '">' + esc(meta) + '</span>' +
      copyButton(copyPayload, 'Copy', 'event-copy-btn') + '</span></div></summary>';
    if (bodyText) {
      html += '<div class="event-body">' + esc(bodyText) + '</div>';
    } else if (summary) {
      html += '<div class="event-body compact">' + summary + '</div>';
    } else {
      html += '<div class="event-body">' + esc(item.raw) + '</div>';
    }
    html += '</details>';
  });
  html += '</div>';
  return html;
}

function renderPlainOutput(text, copyLabel) {
  return '<div class="output-shell">' + copyButton(text, copyLabel || 'Copy') + '<pre class="output">' + esc(text) + '</pre></div>';
}

function renderDetailWithCopy(key, summaryLabel, text, copyLabel, bodyHtml) {
  return '<details data-detail-key="' + esc(key) + '">' +
    '<summary class="summary-row"><span class="summary-title">' + esc(summaryLabel) + '</span>' + copyButton(text, copyLabel || 'Copy') + '</summary>' +
    (bodyHtml || '<pre class="output">' + esc(text) + '</pre>') +
    '</details>';
}

// --- Filters ---

function buildFilterButtons() {
  const row = document.getElementById('filter-row');
  row.innerHTML = '';
  STATUSES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (currentFilter === s ? ' active' : '');
    btn.textContent = s;
    btn.onclick = () => { currentFilter = s; buildFilterButtons(); renderTaskList(); };
    row.appendChild(btn);
  });
}

function applyFilters() {
  searchQuery = document.getElementById('task-search').value.trim().toLowerCase();
  renderTaskList();
}

function getFilteredTasks() {
  return allTasks.filter(t => {
    if (currentFilter !== 'All' && t.status !== currentFilter) return false;
    if (searchQuery) {
      const hay = [t.title, t.id, t.branchName, ''].join(' ').toLowerCase();
      if (!hay.includes(searchQuery)) return false;
    }
    return true;
  });
}

function taskCreatedMillis(task) {
  const value = task && task.createdAt ? Date.parse(task.createdAt) : 0;
  return Number.isFinite(value) ? value : 0;
}

function compareTasksByCreatedDesc(a, b) {
  const diff = taskCreatedMillis(b) - taskCreatedMillis(a);
  if (diff !== 0) return diff;
  return String(b.id || '').localeCompare(String(a.id || ''));
}

function taskMatchesListFilter(task) {
  if (currentFilter !== 'All' && task.status !== currentFilter) return false;
  if (searchQuery) {
    const hay = [task.title, task.id, task.branchName, task.parentId, ''].join(' ').toLowerCase();
    if (!hay.includes(searchQuery)) return false;
  }
  return true;
}

function buildTaskGroups() {
  const byId = new Map(allTasks.map(t => [t.id, t]));
  const childrenByParent = new Map();
  allTasks.forEach(t => {
    if (!t.parentId) return;
    if (!childrenByParent.has(t.parentId)) childrenByParent.set(t.parentId, []);
    childrenByParent.get(t.parentId).push(t);
  });
  childrenByParent.forEach(children => children.sort(compareTasksByCreatedDesc));

  const parentCandidates = allTasks.filter(t => !t.parentId || !byId.has(t.parentId));
  const groups = [];
  parentCandidates.forEach(parent => {
    const children = childrenByParent.get(parent.id) || [];
    const matchingChildren = children.filter(taskMatchesListFilter);
    const parentMatches = taskMatchesListFilter(parent);
    if (!parentMatches && matchingChildren.length === 0) return;
    groups.push({
      parent,
      children,
      visibleChildren: searchQuery || currentFilter !== 'All' ? matchingChildren : children,
      forceExpanded: !parentMatches && matchingChildren.length > 0
    });
  });
  return groups.sort((a, b) => compareTasksByCreatedDesc(a.parent, b.parent));
}

// --- Task List ---

async function loadTaskList() {
  try {
    allTasks = await fetchJson(API + '/tasks');
    renderTaskList();
    document.getElementById('refresh-indicator').textContent = formatTimeShort(new Date().toISOString());
  } catch (e) {
    console.error('Failed to load tasks', e);
  }
}

function renderTaskList() {
  const container = document.getElementById('task-list');
  const groups = buildTaskGroups();
  container.innerHTML = '';
  if (groups.length === 0) {
    container.innerHTML = '<div class="empty-state">No tasks found</div>';
    return;
  }
  groups.forEach(group => {
    const wrapper = document.createElement('div');
    wrapper.className = 'task-group';
    wrapper.appendChild(renderTaskItem(group.parent, {
      isParent: true,
      childCount: group.children.length,
      forceExpanded: group.forceExpanded
    }));

    const isExpanded = group.forceExpanded || expandedTaskGroups.has(group.parent.id);
    if (isExpanded && group.visibleChildren.length > 0) {
      const childWrap = document.createElement('div');
      childWrap.className = 'task-children';
      group.visibleChildren.forEach(child => {
        childWrap.appendChild(renderTaskItem(child, { isChild: true }));
      });
      wrapper.appendChild(childWrap);
    }
    container.appendChild(wrapper);
  });
}

function renderTaskItem(t, opts = {}) {
    const div = document.createElement('div');
    const hasChildren = opts.childCount > 0;
    const expanded = opts.forceExpanded || expandedTaskGroups.has(t.id);
    div.className = 'task-item' +
      (opts.isParent ? ' task-group-parent' : '') +
      (opts.isChild ? ' task-child-item' : '') +
      (hasChildren ? ' has-children' : '') +
      (t.id === selectedTaskId ? ' active' : '');
    div.onclick = () => selectTask(t.id);
    const parentInfo = t.parentId ? ' <span class="child-chip">child:' + esc(t.parentId.substring(0,6)) + '</span>' : '';
    const childrenInfo = hasChildren ? ' <span class="children-count-chip">' + opts.childCount + ' child' + (opts.childCount === 1 ? '' : 'ren') + '</span>' : '';
    const errorInfo = t.error ? ' <span class="task-error-chip" title="' + esc(t.error) + '">ERR</span>' : '';
    const timeStr = t.createdAt ? formatTimeShort(t.createdAt) : (t.updatedAt ? formatTimeShort(t.updatedAt) : '');
    div.innerHTML =
      '<div class="task-title">' + esc(t.title) + '</div>' +
      '<div class="task-meta">' +
        '<span class="badge badge-' + t.status + '">' + t.status + '</span>' +
        '<span class="badge badge-' + t.priority + '">' + t.priority + '</span>' +
        parentInfo + childrenInfo + errorInfo +
        (t.branchName ? ' <span class="branch-chip">' + esc(t.branchName) + '</span>' : '') +
        (timeStr ? ' <span class="task-time">' + timeStr + '</span>' : '') +
      '</div>';
    if (hasChildren) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'task-expand-btn' + (expanded ? ' expanded' : '');
      btn.title = expanded ? 'Collapse child tasks' : 'Expand child tasks';
      btn.setAttribute('aria-label', btn.title);
      btn.setAttribute('aria-expanded', String(expanded));
      btn.textContent = '›';
      btn.onclick = (event) => {
        event.stopPropagation();
        if (expandedTaskGroups.has(t.id)) {
          expandedTaskGroups.delete(t.id);
        } else {
          expandedTaskGroups.add(t.id);
        }
        renderTaskList();
      };
      div.appendChild(btn);
    }
    return div;
}

// --- Select Task ---

async function selectTask(id) {
  selectedTaskId = id;
  renderTaskList();
  await loadTaskDetail(id);
}

async function loadTaskDetail(id) {
  const panel = document.getElementById('detail-panel');
  try {
    const [detail, runs] = await Promise.all([
      fetchJson(API + '/tasks/' + id),
      fetchJson(API + '/tasks/' + id + '/runs')
    ]);
    renderTaskDetail(detail, runs);
  } catch (e) {
    panel.innerHTML = '<div class="no-selection">Error loading task: ' + esc(e.message) + '</div>';
  }
}

// --- Task Detail ---

function tr(label, value) {
  return '<tr><td>' + label + '</td><td>' + (value != null ? value : '-') + '</td></tr>';
}

function rememberDetailsState(panel) {
  if (renderedTaskId) {
    panelScrollState.set(renderedTaskId, panel.scrollTop);
  }
  panel.querySelectorAll('details[data-detail-key]').forEach(d => {
    detailsOpenState.set(d.dataset.detailKey, d.open);
    const output = d.querySelector('.output');
    if (output) {
      detailsScrollState.set(d.dataset.detailKey, output.scrollTop);
    }
  });
}

function restoreDetailsState(panel) {
  panel.querySelectorAll('details[data-detail-key]').forEach(d => {
    const saved = detailsOpenState.get(d.dataset.detailKey);
    if (saved !== undefined) {
      d.open = saved;
    }
    d.addEventListener('toggle', () => {
      detailsOpenState.set(d.dataset.detailKey, d.open);
    });
    const output = d.querySelector('.output');
    const savedScrollTop = detailsScrollState.get(d.dataset.detailKey);
    if (output && savedScrollTop !== undefined) {
      output.scrollTop = savedScrollTop;
      output.addEventListener('scroll', () => {
        detailsScrollState.set(d.dataset.detailKey, output.scrollTop);
      });
    }
  });
}

function renderTaskDetail(t, runs) {
  lastTaskDetail = t;
  lastTaskRuns = runs;
  const panel = document.getElementById('detail-panel');
  rememberDetailsState(panel);
  const savedPanelScrollTop = panelScrollState.get(t.id);
  const canDispatch = !isActionPending && t.status === 'PENDING';
  const canCancel = !isActionPending && t.status !== 'COMPLETED' && t.status !== 'CANCELLED';
  const canRevise = !isActionPending && ['NEEDS_ARBITRATION', 'FAILED'].includes(t.status);
  const canClean = !isActionPending && ['COMPLETED', 'FAILED', 'CANCELLED', 'NEEDS_ARBITRATION'].includes(t.status);
  const canPublish = !isActionPending && t.status === 'COMPLETED';

  let childrenHtml = '';
  if (t.children && t.children.length > 0) {
    childrenHtml = '<div class="detail-section"><h4>Children</h4><table class="detail-table">';
    t.children.forEach(c => {
      childrenHtml += '<tr><td><a href="#" class="child-link" onclick="selectTask(\'' + c.id + '\');return false">' + esc(c.id.substring(0,12)) + '</a></td><td>' +
        esc(c.title) + ' <span class="badge badge-' + c.status + '">' + c.status + '</span></td></tr>';
    });
    childrenHtml += '</table></div>';
  }

  let phaseOutputsHtml = '';
  const phases = [
    {label: 'Plan Output', val: t.planOutput},
    {label: 'Test Output', val: t.testOutput},
    {label: 'Test Review Output', val: t.testReviewOutput},
    {label: 'Code Output', val: t.codeOutput},
    {label: 'Review Output', val: t.reviewOutput}
  ];
  phases.forEach(p => {
    if (p.val) {
      const key = 'task:' + t.id + ':phase:' + p.label;
      phaseOutputsHtml += '<div class="phase-output">' + renderDetailWithCopy(key, p.label, p.val, 'Copy role output') + '</div>';
    }
  });
  if (phaseOutputsHtml) {
    phaseOutputsHtml = '<div class="detail-section"><h4>Phase Outputs</h4>' + phaseOutputsHtml + '</div>';
  }

  let runsHtml = '';
  if (runs && runs.length > 0) {
    runsHtml = '<div class="detail-section"><h4>Agent Runs (' + runs.length + ')</h4>';
    runs.forEach(r => {
      const isError = r.exitCode !== 0;
      runsHtml += '<div class="run-card' + (isError ? ' error-run' : '') + '">' +
        '<div class="run-header"><span class="run-type">' + esc(r.agentType) +
        (r.variant ? ' <span class="run-subtle">(' + esc(r.variant) + ')</span>' : '') +
        '</span>' +
        '<span class="run-subtle">' + formatTime(r.createdAt) + '</span></div>' +
        '<div class="run-meta">' +
          'Model: ' + esc(r.model) +
          ' | Exit: <span' + (isError ? ' class="error-badge"' : '') + '>' + r.exitCode + '</span>' +
          ' | Duration: ' + formatDuration(r.durationMs) +
          (r.sessionId ? ' | Session: <code class="session-code">' + esc(r.sessionId) + '</code> <button class="copy-btn" onclick="copyText(\'' + esc(r.sessionId) + '\')">Copy</button>' : '') +
          (r.continueCount > 0 ? ' | Continues: ' + r.continueCount : '') +
        '</div>';
      if (r.prompt) {
        const promptKey = 'task:' + t.id + ':run:' + r.id + ':prompt';
        runsHtml += renderDetailWithCopy(promptKey, 'Prompt', r.prompt, 'Copy prompt');
      }
      if (r.output) {
        const outputKey = 'task:' + t.id + ':run:' + r.id + ':output';
        runsHtml += renderDetailWithCopy(outputKey, 'Output', r.output, 'Copy output', renderEventOutput(r.output));
      }
      runsHtml += '</div>';
    });
    runsHtml += '</div>';
  }

  let reviseFormHtml = '';
  if (canRevise) {
    reviseFormHtml = '<div class="revise-form" id="revise-section">' +
      '<label>Revision Feedback</label>' +
      '<textarea id="revise-feedback" placeholder="Enter revision feedback..."></textarea>' +
      '<div class="btn-row"><button class="primary" onclick="doRevise()">Submit Revision</button></div></div>';
  }

  panel.innerHTML =
    '<div class="detail-header"><h3>' + esc(t.title) + '</h3></div>' +
    '<div class="actions">' +
      '<button class="primary" onclick="doDispatch(this)"' + (canDispatch ? '' : ' disabled') + '>Dispatch</button>' +
      '<button class="danger" onclick="doCancel(this)"' + (canCancel ? '' : ' disabled') + '>Cancel</button>' +
      '<button onclick="focusRevise()"' + (canRevise ? '' : ' disabled') + '>Revise</button>' +
      '<button onclick="doClean(this)"' + (canClean ? '' : ' disabled') + '>Clean</button>' +
      '<button class="primary" onclick="doPublish(this)"' + (canPublish ? '' : ' disabled') + '>Publish</button>' +
    '</div>' +
    reviseFormHtml +
    '<div class="detail-section"><h4>Details</h4><table class="detail-table">' +
      tr('ID', '<code class="inline-code">' + esc(t.id) + '</code>') +
      tr('Status', '<span class="badge badge-' + t.status + '">' + t.status + '</span>') +
      tr('Priority', '<span class="badge badge-' + t.priority + '">' + t.priority + '</span>') +
      tr('Mode', t.taskMode || '-') +
      tr('Parent ID', t.parentId ? '<code class="inline-code">' + esc(t.parentId) + '</code>' : '-') +
      tr('Branch', t.branchName ? '<code class="inline-code">' + esc(t.branchName) + '</code>' : '-') +
      tr('Worktree', t.worktreePath ? '<code class="inline-code">' + esc(t.worktreePath) + '</code>' : '-') +
      tr('Complexity', t.complexity || '-') +
      tr('Force No Split', t.forceNoSplit ? 'Yes' : 'No') +
      tr('Test Retries', t.testRetryCount + ' / ' + t.maxTestRetries) +
      tr('Code Retries', t.codeRetryCount + ' / ' + t.maxCodeRetries) +
      tr('Review Pass', t.reviewPass ? 'Yes' : 'No') +
      tr('Session IDs', (t.sessionIds || []).map(s => '<code class="inline-code small">' + esc(s) + '</code>').join(', ') || '-') +
      tr('Error', t.error ? '<span class="error-text">' + esc(t.error) + '</span>' : '-') +
      tr('User Feedback', t.userFeedback || '-') +
      tr('Description', '<pre class="output description-output">' + esc(t.description) + '</pre>') +
      tr('Created', formatTime(t.createdAt)) +
      tr('Updated', formatTime(t.updatedAt)) +
      tr('Started', formatTime(t.startedAt)) +
      tr('Completed', formatTime(t.completedAt)) +
      tr('Published', formatTime(t.publishedAt)) +
    '</table></div>' +
    childrenHtml +
    phaseOutputsHtml +
    runsHtml;
  restoreDetailsState(panel);
  if (savedPanelScrollTop !== undefined) {
    panel.scrollTop = savedPanelScrollTop;
  }
  renderedTaskId = t.id;
}

function focusRevise() {
  const el = document.getElementById('revise-feedback');
  if (el) el.focus();
}

// --- Actions ---

async function doAction(action, btn, body) {
  if (!selectedTaskId || isActionPending) return;
  isActionPending = true;
  if (btn) { btn.disabled = true; btn.classList.add('loading'); }
  try {
    const opts = { method: 'POST', headers: {} };
    if (body) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    const result = await fetchJson(API + '/tasks/' + selectedTaskId + '/' + action, opts);
    showToast(result.message || 'Success', 'success');
    await loadTaskList();
    if (selectedTaskId) await loadTaskDetail(selectedTaskId);
  } catch (e) {
    showToast('Error: ' + e.message, 'error');
  } finally {
    isActionPending = false;
    if (lastTaskDetail && selectedTaskId) renderTaskDetail(lastTaskDetail, lastTaskRuns);
  }
}

function doDispatch(btn) { if (confirm('Dispatch this task?')) doAction('dispatch', btn); }
function doCancel(btn) { if (confirm('Cancel this task?')) doAction('cancel', btn); }
function doClean(btn) { if (confirm('Clean worktree and branch?')) doAction('clean', btn); }
function doPublish(btn) { if (confirm('Publish branch?')) doAction('publish', btn); }

async function doRevise() {
  const ta = document.getElementById('revise-feedback');
  if (!ta) return;
  const feedback = ta.value.trim();
  if (!feedback) { showToast('Feedback is required', 'error'); return; }
  if (!confirm('Submit revision with the provided feedback?')) return;
  const btn = ta.parentElement.querySelector('button');
  await doAction('revise', btn, { feedback });
}

// --- New Task Modal ---

function openNewTaskModal() {
  document.getElementById('new-task-modal').classList.add('show');
  document.getElementById('nt-title').value = '';
  document.getElementById('nt-desc').value = '';
  document.getElementById('nt-priority').value = 'MEDIUM';
  document.getElementById('nt-forceNoSplit').checked = false;
  clearFormErrors();
  document.getElementById('nt-title').focus();
  formDirty = false;
}

function closeNewTaskModal() {
  document.getElementById('new-task-modal').classList.remove('show');
  formDirty = false;
}

function clearFormErrors() {
  document.querySelectorAll('.form-error').forEach(el => { el.textContent = ''; el.classList.remove('show'); });
}

function showFieldError(id, msg) {
  const el = document.getElementById(id);
  if (el) { el.textContent = msg; el.classList.add('show'); }
}

async function submitNewTask() {
  clearFormErrors();
  const title = document.getElementById('nt-title').value.trim();
  const description = document.getElementById('nt-desc').value.trim();
  const priority = document.getElementById('nt-priority').value;
  const forceNoSplit = document.getElementById('nt-forceNoSplit').checked;

  let valid = true;
  if (!title) { showFieldError('nt-title-err', 'Title is required'); valid = false; }
  if (!description) { showFieldError('nt-desc-err', 'Description is required'); valid = false; }
  if (!valid) return;

  const btn = document.getElementById('nt-submit-btn');
  btn.disabled = true;
  try {
    const result = await fetchJson(API + '/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description, priority, forceNoSplit })
    });
    closeNewTaskModal();
    showToast('Task created: ' + result.title, 'success');
    await loadTaskList();
    selectTask(result.id);
  } catch (e) {
    showFieldError('nt-submit-err', 'Failed to create task: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

// Close modal on overlay click
document.getElementById('new-task-modal').addEventListener('click', function(e) {
  if (e.target === this) closeNewTaskModal();
});

// Track form dirty state to prevent auto-refresh from clearing inputs
document.getElementById('nt-title').addEventListener('input', () => { formDirty = true; });
document.getElementById('nt-desc').addEventListener('input', () => { formDirty = true; });

// --- Polling ---

function startPolling() {
  initThemeToggle();
  loadSystemStatus();
  loadTaskList();
  buildFilterButtons();
  pollTimer = setInterval(() => {
    loadSystemStatus();
    if (!document.getElementById('new-task-modal').classList.contains('show')) {
      loadTaskList();
    }
    if (selectedTaskId && !isActionPending && !document.getElementById('revise-section')) {
      loadTaskDetail(selectedTaskId);
    }
  }, 5000);
}

startPolling();

// --- System / Model Configuration ---

let availableModels = [];
let currentModelConfig = null;
let reviewerIdCounter = 0;

function openSystemModal() {
  reviewerIdCounter = 0;
  document.getElementById('sys-modal').classList.add('show');
  loadModelConfig();
}

function closeSystemModal() {
  document.getElementById('sys-modal').classList.remove('show');
}

async function loadModelConfig() {
  const body = document.getElementById('sys-modal-body');
  body.innerHTML = '<div class="sys-loading">Loading model configuration...</div>';
  try {
    const [modelsResp, configResp] = await Promise.all([
      fetchJson(API + '/models').catch(e => { console.warn('Failed to load models:', e); return { models: [] }; }),
      fetchJson(API + '/config')
    ]);
    availableModels = modelsResp.models || [];
    currentModelConfig = configResp;
    renderModelConfig(configResp);
  } catch (e) {
    body.innerHTML = '<div class="sys-error">Failed to load model configuration: ' + esc(e.message) + '</div>';
  }
}

function buildModelSelect(id, current) {
  const all = availableModels.includes(current) ? availableModels : (current ? [current, ...availableModels] : availableModels);
  let opts = all.map(m =>
    '<option value="' + esc(m) + '"' + (m === current ? ' selected' : '') + '>' + esc(m) + '</option>'
  ).join('');
  return '<select id="' + id + '">' + opts + '</select>';
}

function modelSpecInputs(prefix, spec) {
  const model = spec ? spec.model : '';
  const variant = spec ? (spec.variant || '') : '';
  const agent = spec ? (spec.agent || '') : '';
  return '<div class="sys-row">' +
    '<label>Model</label>' + buildModelSelect(prefix + '-model', model) +
    '</div>' +
    '<div class="sys-row">' +
    '<label>Variant</label><input type="text" class="variant-input" id="' + prefix + '-variant" value="' + esc(variant) + '" placeholder="(optional)">' +
    '<label>Agent</label><input type="text" class="agent-input" id="' + prefix + '-agent" value="' + esc(agent) + '" placeholder="(optional)">' +
    '</div>';
}

function renderModelConfig(cfg) {
  const body = document.getElementById('sys-modal-body');
  let html = '';

  if (availableModels.length === 0) {
    html += '<div class="sys-error">No models available. Make sure opencode is installed and configured.</div>';
  }

  html += '<div class="sys-card"><h4>Planner Model</h4>' + modelSpecInputs('sys-planner', cfg.planner) + '</div>';
  html += '<div class="sys-card"><h4>Test Writer Model</h4>' + modelSpecInputs('sys-test-writer', cfg.testWriter) + '</div>';
  html += '<div class="sys-card"><h4>Test Reviewer Model</h4>' + modelSpecInputs('sys-test-reviewer', cfg.testReviewer) + '</div>';
  html += '<div class="sys-card"><h4>Default Coder Model</h4>' + modelSpecInputs('sys-coder-default', cfg.coderDefault) + '</div>';

  html += '<div class="sys-section-title">Coder by Complexity</div>';
  const complexities = ['very_complex', 'complex', 'medium', 'simple'];
  const coderByComplexity = cfg.coderByComplexity || {};
  complexities.forEach(c => {
    html += '<div class="sys-card"><h4>' + esc(c) + '</h4>' + modelSpecInputs('sys-coder-' + c, coderByComplexity[c]) + '</div>';
  });

  html += '<div class="sys-section-title">Reviewers</div>';
  html += '<div id="sys-reviewers-container">';
  const reviewers = cfg.reviewers || [];
  reviewerIdCounter = 0;
  if (reviewers.length === 0) {
    html += '<div class="sys-empty">No reviewers configured</div>';
  } else {
    reviewers.forEach((r, i) => {
      html += reviewerRowHtml(reviewerIdCounter++, r);
    });
  }
  html += '</div>';
  html += '<button class="btn-add-reviewer" onclick="addReviewerRow()">+ Add Reviewer</button>';

  body.innerHTML = html;
}

function reviewerRowHtml(index, spec) {
  const model = spec ? spec.model : '';
  const variant = spec ? (spec.variant || '') : '';
  const agent = spec ? (spec.agent || '') : '';
  return '<div class="sys-reviewer-row" id="sys-reviewer-' + index + '">' +
    buildModelSelect('sys-reviewer-' + index + '-model', model) +
    '<input type="text" class="variant-input" id="sys-reviewer-' + index + '-variant" value="' + esc(variant) + '" placeholder="variant">' +
    '<input type="text" class="agent-input" id="sys-reviewer-' + index + '-agent" value="' + esc(agent) + '" placeholder="agent">' +
    '<button class="btn-remove-reviewer" onclick="removeReviewerRow(' + index + ')">&times;</button>' +
    '</div>';
}

function addReviewerRow() {
  const container = document.getElementById('sys-reviewers-container');
  const emptyEl = container.querySelector('.sys-empty');
  if (emptyEl) emptyEl.remove();
  const index = reviewerIdCounter++;
  const div = document.createElement('div');
  div.innerHTML = reviewerRowHtml(index, null);
  container.appendChild(div.firstElementChild);
}

function removeReviewerRow(index) {
  const el = document.getElementById('sys-reviewer-' + index);
  if (el) el.remove();
}

function getModelSpecFromInputs(prefix) {
  const modelEl = document.getElementById(prefix + '-model');
  const variantEl = document.getElementById(prefix + '-variant');
  const agentEl = document.getElementById(prefix + '-agent');
  if (!modelEl) return null;
  return {
    model: modelEl.value,
    variant: variantEl ? variantEl.value : '',
    agent: agentEl ? agentEl.value : ''
  };
}

async function saveModelConfig() {
  const btn = document.getElementById('sys-save-btn');
  btn.disabled = true;
  try {
    const complexities = ['very_complex', 'complex', 'medium', 'simple'];
    const coderByComplexity = {};
    complexities.forEach(c => {
      const spec = getModelSpecFromInputs('sys-coder-' + c);
      if (spec && spec.model) coderByComplexity[c] = spec;
    });

    const reviewerContainer = document.getElementById('sys-reviewers-container');
    const reviewerRows = reviewerContainer.querySelectorAll('.sys-reviewer-row');
    const reviewers = [];
    reviewerRows.forEach(row => {
      const id = row.id;
      const modelEl = document.getElementById(id + '-model');
      if (modelEl && modelEl.value) {
        reviewers.push({
          model: modelEl.value,
          variant: (document.getElementById(id + '-variant') || {}).value || '',
          agent: (document.getElementById(id + '-agent') || {}).value || ''
        });
      }
    });

    const payload = {
      planner: getModelSpecFromInputs('sys-planner'),
      test_writer: getModelSpecFromInputs('sys-test-writer'),
      test_reviewer: getModelSpecFromInputs('sys-test-reviewer'),
      coder_default: getModelSpecFromInputs('sys-coder-default'),
      coder_by_complexity: coderByComplexity,
      reviewers: reviewers
    };

    await fetchJson(API + '/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    showToast('Model configuration saved', 'success');
    closeSystemModal();
  } catch (e) {
    showToast('Failed to save: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('sys-modal').addEventListener('click', function(e) {
  if (e.target === this) closeSystemModal();
});
</script>
