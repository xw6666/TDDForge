spring:
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/h2-migration
  datasource:
    url: jdbc:h2:mem:integration_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

repo:
  path: /tmp/integration-test-repo
  base_branch: main
  worktree_dir: /tmp/integration-test-worktrees

opencode:
  config_path: /tmp/test-opencode.json
  timeout_seconds: 30
  max_continues: 2
  planner:
    model: test-planner-model
  test_writer:
    model: test-writer-model
  test_reviewer:
    model: test-reviewer-model
  coder_default:
    model: test-coder-model
  reviewers:
    - model: test-reviewer-model

orchestrator:
  max_parallel_tasks: 3
  max_test_retries: 2
  max_code_retries: 4
  poll_interval_seconds: 5

mysql:
  url: jdbc:h2:mem:integration_test
  username: sa
  password: sa

publish:
  remote: test-remote
